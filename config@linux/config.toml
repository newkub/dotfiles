[tools]
eza = "latest"
starship = "latest"

# WSL/Linux dotfiles tracked in place. os = "linux" keeps separate content
# streams from Windows at the same repo paths.
[dotfiles]
"~/.bash_profile" = { mode = "track", variants = [{ os = "linux" }] }
"~/.bashrc" = { mode = "track", variants = [{ os = "linux" }] }
"~/.config/carapace" = { mode = "track", variants = [{ os = "linux" }] }
"~/.config/devin/config.json" = { mode = "track", variants = [{ os = "linux" }] }
"~/.config/ghostty" = { mode = "track", variants = [{ os = "linux" }] }
"~/.config/mise" = { mode = "track", variants = [{ os = "linux" }] }
"~/.config/starship" = { mode = "track", variants = [{ os = "linux" }] }
"~/.config/starship.toml" = { mode = "track", variants = [{ os = "linux" }] }

[tasks.dotfiles-status]
description = "Show dotfiles tracking status"
run = "mise dotfiles status"


[bootstrap.services.mise-history]
builtin = "history-watch"

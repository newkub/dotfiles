[settings]
env_shell_expand = true
auto_install = true
windows_shim_mode = "exe"
experimental = true
minimum_release_age = "0"
[settings.npm]
bun = true

# mise's built-in plaintext scan flags env-var refs and placeholder values
# (e.g. "${VAR}", "YOUR_TOKEN") as secrets. All real credentials are untracked;
# the gitleaks gate in the dotfiles:sync task remains the real secret check.
[settings.history]
allow_plaintext_history = true

# History checkpoint commits are created by mise, not git — the author name is
# fixed to "mise"; git_email controls the author/committer email so GitHub can
# attribute the commits to this account.
[history]
git_email = "newkubise@gmail.com"

# Encrypted history: files that legitimately contain key-like lines (env refs,
# placeholders) are stored as age ciphertext; the working files stay plaintext.
# Identity: ~/.ssh/id_ed25519 (no passphrase). Add a recovery recipient later.
[history.encryption]
recipients = ["ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIILut7f/gaJdn4QhkifTdkzQIZffjQn3qrNSowVKlHYz newkubise@gmail.com"]

# Dotfiles tracked in place (history only, never deployed). Each entry is
# scoped to this OS via `variants` so Windows and WSL keep separate contents
# at the same repo path. Secrets/state dirs are deliberately absent.

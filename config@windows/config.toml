[tasks.update-all]
description = "update all tools"
shell = "pwsh -NoProfile -Command"
run = '''
$ErrorActionPreference = "Continue"
$ProgressPreference = "SilentlyContinue"
$script:failed = 0

function Strip-Ansi ($text) {
    $text -replace '\x1b\[[0-9;]*m', ''
}

function Step ($name, $scriptblock) {
    Write-Host "`n[update-all] $name" -ForegroundColor Cyan
    try {
        $lastExit = 0
        $output = & $scriptblock 2>&1
        $lastExit = $LASTEXITCODE
        if ($lastExit -ne 0) { throw "exit code $lastExit" }
        $output | ForEach-Object { Write-Host "  $_" }
        Write-Host "  OK" -ForegroundColor Green
    } catch {
        Write-Host "  FAIL: $_" -ForegroundColor Red
        $script:failed++
    }
}

function Test-Admin {
    $p = [Security.Principal.WindowsPrincipal]::new([Security.Principal.WindowsIdentity]::GetCurrent())
    $p.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)
}

Step "winget sources" {
    $ok = $true
    winget source update --name msstore; if ($LASTEXITCODE -ne 0) { $ok = $false }
    winget source update --name winget; if ($LASTEXITCODE -ne 0) { $ok = $false }
    winget source update --name winget-font; if ($LASTEXITCODE -ne 0) { $ok = $false }
    if (-not $ok) { exit 1 }
}

Step "scoop" {
    scoop update | ForEach-Object { Write-Host "  $_" }
    if ($LASTEXITCODE -ne 0) { throw }

    scoop hold mise | ForEach-Object { Write-Host "  $_" }

    $outdated = (scoop status 6>&1 | Out-String -Stream) |
        ForEach-Object { Strip-Ansi $_ } |
        Select-String '^(?!Name|----|\s*$)([^\s]+)' |
        ForEach-Object { $_.Matches.Groups[1].Value } |
        Sort-Object -Unique

    foreach ($pkg in $outdated) {
        if ($pkg -eq 'mise') {
            Write-Host "  skip $pkg (held/self-managed)" -ForegroundColor Yellow
            continue
        }
        Write-Host "  update $pkg"
        try {
            $out = scoop update $pkg 2>&1
            $out | ForEach-Object { Write-Host "    $_" }
            if ($LASTEXITCODE -ne 0) { throw }
            Write-Host "    OK" -ForegroundColor Green
        } catch {
            Write-Host "    FAIL: $_" -ForegroundColor Red
            $script:failed++
        }
    }
}

Step "winget" {
    $wingetSkip = @(
        'BandicamCompany.Bandicam',
        'BandicamCompany.Bandicut',
        'Chocolatey.Chocolatey',
        'Microsoft.Edge'
    )
    foreach ($id in $wingetSkip) {
        winget pin add --id $id 2>&1 | ForEach-Object { Write-Host "  pin: $_" }
        $null = $LASTEXITCODE
    }
    winget upgrade --all --accept-source-agreements --accept-package-agreements
}

Step "bun" { bun update -g }
Step "npm" { npm update -g }
Step "pnpm" {
    if (Get-Command pnpm -ErrorAction SilentlyContinue) { pnpm update -g } else { Write-Host "  pnpm not installed, skipping" -ForegroundColor Yellow }
}

Step "pip" {
    python -m pip install --upgrade pip
    if ($LASTEXITCODE -ne 0) { throw }
    python -m pip_review --auto
}

Step "uv" { uv tool upgrade --all }

Step "pipx" {
    if (Get-Command pipx -ErrorAction SilentlyContinue) {
        pipx upgrade-all
    } else {
        Write-Host "  pipx not installed, skipping" -ForegroundColor Yellow
    }
}

Step "choco" {
    if (Test-Admin) {
        choco upgrade all -y
    } else {
        Write-Host "  not admin, skipping choco" -ForegroundColor Yellow
    }
}

Step "cargo" {
    if (-not (Get-Command cargo-install-update -ErrorAction SilentlyContinue)) {
        if (Get-Command cargo-binstall -ErrorAction SilentlyContinue) {
            cargo-binstall cargo-update -y
        } else {
            cargo install cargo-update
        }
    }
    cargo install-update -a
}

Step "wsl" {
    if (Test-Admin -and (Get-Command wsl -ErrorAction SilentlyContinue)) {
        wsl --update
    } else {
        Write-Host "  skip wsl (not admin or not installed)" -ForegroundColor Yellow
    }
}

Step "mise tools" { mise upgrade }
Step "mise prune" { mise prune --yes }
Step "mise reshim" { mise reshim }
Step "mise self-update" { mise self-update -y }

Step "rustup" { rustup update stable }
Step "gh extensions" { gh extension upgrade --all }
Step "program-export" { mise run program-export }
Step "skills" {
    skills update
    skills update -g
}

Write-Host "`n[update-all] completed with $failed failure(s)" -ForegroundColor $(if ($failed -eq 0) { 'Green' } else { 'Red' })
exit $failed
'''


[tasks.cleanup]
description = "clean development artifacts and caches"
shell = "pwsh -NoProfile -Command"
run = '''
$ErrorActionPreference = "Continue"
devp run -y
scoop cleanup *
scoop cache rm *
bun pm cache rm
npm cache clean --force
if (Get-Command pnpm -ErrorAction SilentlyContinue) { pnpm store prune } else { Write-Host "  skip pnpm (not installed)" }
# uv cache is locked by running uv-tool MCP servers (mcp-for-blender etc.);
# stop them first - they respawn on the next MCP call. prune keeps in-use
# venvs, clean would delete them outright.
Get-CimInstance Win32_Process | Where-Object { $_.Name -in @('uv.exe','uvx.exe') -or ($_.ExecutablePath -and $_.ExecutablePath -match 'uv\\cache') } | ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue }
uv cache prune --force
python -m pip cache purge
mise cache clear
mise prune --yes
# compact VHD/VHDX (self-elevates via UAC)
mise run vhd:optimize
'''

[tasks.program-list]
description = "list installed programs"
shell = "pwsh -Command"
run = '& { function Show-Section ($title, $script, $limit = 0) { Write-Host "`n=== $title ===" -ForegroundColor Cyan; try { $out = & $script 2>$null } catch { $out = $null }; if (-not $out) { Write-Host "  no output / not installed" -ForegroundColor Yellow } else { $lines = @($out); $total = $lines.Count; if ($limit -gt 0 -and $total -gt $limit) { $lines | Select-Object -First $limit | Out-Host; Write-Host "  ... $total lines total, showing first $limit" -ForegroundColor Gray } else { $lines | Out-Host; Write-Host "  $total lines" -ForegroundColor Gray } } }; Show-Section "Scoop" { scoop list }; Show-Section "Mise" { mise list }; Show-Section "Bun" { bun pm ls -g }; Show-Section "npm" { npm list -g --depth=0 }; Show-Section "pnpm" { pnpm list -g }; Show-Section "uv" { uv tool list }; Show-Section "pip" { python -m pip list }; Show-Section "winget" { winget list } 50; Show-Section "gh" { gh extension list } }'

[tasks.program-export]
description = "Export installed programs (winget/scoop/mise) into tracked ~/.config/machine/"
shell = "pwsh -NoProfile -Command"
run = '''
$dir = "$env:USERPROFILE\.config\machine"
New-Item -ItemType Directory -Path $dir -Force | Out-Null
winget export -o "$dir\winget-packages.json" --accept-source-agreements
if (Get-Command scoop -ErrorAction SilentlyContinue) { scoop list | Out-File "$dir\scoop-packages.txt" -Encoding utf8 }
mise list | Out-File "$dir\mise-tools.txt" -Encoding utf8
Write-Host "[program-export] wrote $dir" -ForegroundColor Green
'''

[tasks.fix-windows]
description = "repair Windows system files and reset broken Store apps (self-elevates via UAC)"
shell = "pwsh -NoProfile -Command"
run = '''
Start-Process pwsh -Verb RunAs -ArgumentList '-NoProfile','-ExecutionPolicy','Bypass','-File','D:\fix-admin.ps1'
'''

[tasks."vhd:optimize"]
description = "Scan, select, and compact VHD/VHDX files"
dir = "C:/Users/Veerapong/.config/mise"
run = "pwsh -NoProfile -File scripts/Optimize-VirtualDisks.ps1 -Optimize"


[tasks.dotfiles-status]
description = "Show dotfiles tracking status"
run = "mise dotfiles status"

[tasks."dotfiles:sync"]
description = "Secret-scan pending dotfiles checkpoints, then sync to origin (blocks on leaks)"
shell = "pwsh -NoProfile -Command"
run = '''
$repo = "C:\Users\Veerapong\.local\state\mise\history\repo.git"
$gitleaks = (Get-Command gitleaks -ErrorAction SilentlyContinue).Source
if (-not $gitleaks) { Write-Host "gitleaks not found - install with: mise use -g gitleaks" -ForegroundColor Red; exit 1 }
Write-Host "[dotfiles:sync] scanning unpushed checkpoints with gitleaks..." -ForegroundColor Cyan
& $gitleaks git $repo --log-opts="origin/main..HEAD" --redact --exit-code 1
if ($LASTEXITCODE -ne 0) { Write-Host "[dotfiles:sync] BLOCKED: possible secrets in pending checkpoints - review before syncing" -ForegroundColor Red; exit 1 }
Write-Host "[dotfiles:sync] clean - syncing" -ForegroundColor Green
mise dot sync
'''

[tasks.save-terminal-session]
description = "Snapshot open terminal sessions (agent CLIs and shells) and write a Desktop restore launcher"
shell = "pwsh -NoProfile -Command"
run = '''
$desktop = [Environment]::GetFolderPath('Desktop')
$terminalNames = @(
    'WindowsTerminal', 'wt', 'wezterm-gui', 'alacritty', 'kitty',
    'powershell', 'pwsh', 'cmd', 'bash', 'nu', 'fish',
    'devin', 'qoder', 'codex', 'claude', 'gemini', 'kilo', 'opencode', 'amp'
)
$sessions = Get-Process |
    Where-Object { $terminalNames -contains $_.ProcessName } |
    Sort-Object -Property Path -Unique |
    ForEach-Object { [pscustomobject]@{ Name = $_.ProcessName; Title = $_.MainWindowTitle; Path = $_.Path } }
$apps = Get-Process |
    Where-Object { $_.MainWindowTitle -and $_.Path -and $_.Path -notlike "$env:SystemRoot*" } |
    Sort-Object -Property Path -Unique |
    ForEach-Object { [pscustomobject]@{ Name = $_.ProcessName; Title = $_.MainWindowTitle; Path = $_.Path } }
$stamp = Get-Date -Format 'yyyy-MM-dd HH:mm'
$lines = @("# Terminal session snapshot $stamp", "# $($sessions.Count) terminal/agent process(es), $($apps.Count) window(s) total", "")
foreach ($a in $sessions) {
    $p = $a.Path -replace "'", "''"
    $lines += "Start-Process -FilePath '$p'"
}
$ps1 = Join-Path $desktop 'terminal-session-restore.ps1'
$lines | Set-Content -Path $ps1 -Encoding utf8
$bat = Join-Path $desktop 'Restore Terminal Session.bat'
Set-Content -Path $bat -Encoding ascii -Value "@echo off`r`npwsh -NoProfile -ExecutionPolicy Bypass -File `"$ps1`""
Write-Host "[save-terminal-session] $($sessions.Count) terminal session(s) -> $bat" -ForegroundColor Green
'''

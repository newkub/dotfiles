command_timeout = 10000
scan_timeout = 400

format = """\
${os}${env_var.STARSHIP_SHELL}\
$directory$git_branch$line_break$character"""

[env_var.STARSHIP_SHELL]
format = "[󰆍 $env_value]($style) "
style = "bold cyan"

[os]
format = "[$symbol]($style) "
style = "bold blue"
disabled = false

[os.symbols]
Arch = "󰣇 "
Linux = "󰌽 "
Windows = "󰖳 "

[directory]
format = "[󰉋 $path$read_only]($style) "

[git_branch]
format = "[$symbol$branch]($style) "
symbol = "󰘬 "
style = "bold purple"

[git_status]
disabled = true

# version detection shells out to node via the mise shim (~2.5s per prompt)
[nodejs]
disabled = true
